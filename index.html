<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bento Balance · ميزان البنتو</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B1%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0ee;--card:#f8fbfa;--tx:#14211e;--mu:#5d716c;--ln:#cbd9d5;--ac:#14211e;--P:#e4572e;--C:#f2b134;--F:#3a86ff;--V:#2a9d6f;--zn:rgba(42,157,111,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--card:#162622;--tx:#e8f3f0;--mu:#8fa8a2;--ln:#28403a;--ac:#e8f3f0}}
:root[data-theme="dark"]{--bg:#0e1a17;--card:#162622;--tx:#e8f3f0;--mu:#8fa8a2;--ln:#28403a;--ac:#e8f3f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Tajawal,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0;font-weight:800;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--mu);max-width:52ch}
.grid{display:grid;gap:14px;margin-top:14px}
@media(min-width:860px){.grid{grid-template-columns:330px 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
button,input{font:inherit;color:inherit}
input{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--F);outline-offset:2px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);padding:4px 9px}
.row{display:flex;gap:8px;margin:8px 0}
.row input:first-child{flex:1}
#g{width:78px}
#chips{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto}
.chip{background:transparent;border:1px solid var(--ln);border-radius:99px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.chip:hover{border-color:var(--tx)}
h2{font-size:1rem;margin:14px 0 4px}
.it{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid var(--ln);border-radius:10px;margin-top:8px;cursor:pointer}
.it.s{border-color:var(--tx)}
.it .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.it small,.mu{color:var(--mu)}
.mini{display:grid;gap:2px}.mini i{width:11px;height:11px;border-radius:3px}
#stage{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:24px 0 46px;overflow:hidden}
#plate{position:relative;transform-origin:50% 100%;transform:rotate(var(--a,0deg));transition:transform .5s ease}
#plate.sw{animation:sw 1.8s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(calc(var(--a) - var(--s)))}to{transform:rotate(calc(var(--a) + var(--s)))}}
#plate.fall{transform:translateY(34px) rotate(var(--a));transition:transform .9s cubic-bezier(.5,0,1,.6)}
#board{position:relative;background-color:var(--card);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:var(--cs) var(--cs);border:3px solid var(--tx);border-radius:10px;cursor:crosshair}
.blk{position:absolute;inset:0;pointer-events:none;transition:transform .9s cubic-bezier(.5,0,1,.6)}
.c{position:absolute;border-radius:6px;pointer-events:auto;cursor:grab;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px rgba(0,0,0,.18)}
#gh{position:absolute;inset:0;pointer-events:none}
.gh{position:absolute;border-radius:6px;background:var(--tx);opacity:.3}
.gh.bad{background:var(--P)}
#pv{position:absolute;bottom:8px;left:50%;margin-left:-32px;border-left:32px solid transparent;border-right:32px solid transparent;border-bottom:38px solid var(--tx)}
#msg{font-weight:800;min-height:1.6em;margin:6px 0 10px}
.b{margin:8px 0}.b span{font-size:.9rem}
.tr{position:relative;height:12px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--ln)}
.tr i{position:absolute;top:0;bottom:0;inset-inline-start:0;display:block}
.tr .z{background:var(--zn)}
.tr .fl{opacity:.9;transition:width .3s}
#how{font-size:.88rem;color:var(--mu)}
@media (prefers-reduced-motion:reduce){#plate.sw{animation:none}.blk,#plate{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1 data-i="title"></h1><p data-i="sub"></p></div>
 <button class="btn g" id="lg"></button>
</header>
<div class="grid">
 <section class="card">
  <h2 data-i="food" style="margin-top:0"></h2>
  <div class="row"><input id="q" list="dl" data-p="ph" autocomplete="off"><input id="g" type="number" value="100" min="10" max="600" aria-label="g"><button class="btn" id="ad" data-i="add"></button></div>
  <datalist id="dl"></datalist>
  <div id="chips"></div>
  <h2 data-i="budget"></h2>
  <div class="row"><input id="bd" type="range" min="300" max="1000" step="50" value="650" style="flex:1"><b id="bv"></b></div>
  <h2 data-i="tray"></h2>
  <div id="tray"></div>
  <p id="how" data-i="how"></p>
 </section>
 <section class="card">
  <div id="msg" aria-live="polite"></div>
  <div id="stage"><div id="plate"><div id="board"></div></div><div id="pv"></div></div>
  <div id="bars"></div>
  <div class="row" style="justify-content:space-between;align-items:center"><span class="mu" id="info"></span><button class="btn" id="rs" data-i="reset"></button></div>
 </section>
</div>
</div>
<script>
const L={ar:{title:'ميزان البنتو',sub:'حوّل مكونات وجبتك إلى قطع تيتريس ورتّبها على طبق متوازن. إذا اختلّ التوازن الغذائي يسقط الطبق!',food:'أضف طعامك',add:'أضف',ph:'مثال: دجاج، أرز، salmon',budget:'سعرات الوجبة',tray:'قطع الوجبة',empty:'أضف مكونات لتتحول إلى قطع.',protein:'بروتين',carbs:'كربوهيدرات',fat:'دهون',kcal:'سعرة',reset:'إعادة الطبق',how:'اختر قطعة، أدرها بزر ⟳ (أو R)، ثم اضغط على الطبق لوضعها. القطع الثقيلة البعيدة عن المحور تُميل الطبق. المنطقة الخضراء هي النسبة المثالية.',hint:'ضع القطع على الطبق وابدأ التوازن.',left:'المتبقي',over:'تجاوز',nf:'لم أجد هذا الطعام. اختر من القائمة.',win:'🎉 وجبة متوازنة تماماً!',f_over:'💥 تجاوزت سعرات الوجبة فانهار المحور!',f_tilt:'⚖️ الأحمال غير موزعة فانقلب الطبق!',f_macro:'🥩 التوازن الغذائي مختل فسقط الطبق وتداخلت القطع!',score:'النتيجة',tilt:'الميلان',lang:'English'},
en:{title:'Bento Balance',sub:'Turn your ingredients into Tetris blocks and arrange them on a balanced plate. If the meal is nutritionally off, the plate falls!',food:'Add food',add:'Add',ph:'e.g. chicken, rice, تمر',budget:'Meal calories',tray:'Meal blocks',empty:'Add ingredients to turn them into blocks.',protein:'Protein',carbs:'Carbs',fat:'Fat',kcal:'kcal',reset:'Reset plate',how:'Pick a block, rotate it with ⟳ (or R), then tap the plate to place it. Heavy blocks far from the pivot tilt the plate. The green zone is the ideal ratio.',hint:'Place blocks on the plate to start balancing.',left:'Left',over:'Over',nf:'Food not found. Pick one from the list.',win:'🎉 A perfectly balanced meal!',f_over:'💥 Too many calories, the pivot collapsed!',f_tilt:'⚖️ The load was uneven and the plate tipped!',f_macro:'🥩 The nutrition is off, the plate fell and the blocks collided!',score:'Score',tilt:'Tilt',lang:'العربية'}};
const F=[['دجاج مشوي','Grilled chicken',165,31,0,3.6],['أرز','Rice',130,2.7,28,.3],['بيض','Egg',143,13,1.1,10],['سلمون','Salmon',208,20,0,13],['لحم بقري','Beef',250,26,0,15],['تونة','Tuna',116,26,0,1],['عدس','Lentils',116,9,20,.4],['حمص','Chickpeas',164,9,27,2.6],['فول','Foul',110,8,19,.5],['خبز','Bread',265,9,49,3.2],['بطاطس','Potato',87,2,20,.1],['معكرونة','Pasta',158,5.8,31,.9],['شوفان','Oats',389,17,66,7],['بروكلي','Broccoli',34,2.8,7,.4],['سلطة','Salad',20,1.5,3.5,.2],['طماطم','Tomato',18,.9,3.9,.2],['خيار','Cucumber',15,.7,3.6,.1],['أفوكادو','Avocado',160,2,9,15],['موز','Banana',89,1.1,23,.3],['تفاح','Apple',52,.3,14,.2],['تمر','Dates',282,2.5,75,.4],['زبادي','Yogurt',61,3.5,4.7,3.3],['جبن','Cheese',300,20,2,23],['لوز','Almonds',579,21,22,50],['زيت زيتون','Olive oil',884,0,0,100],['بطاطس مقلية','French fries',312,3.4,41,15],['شوكولاتة','Chocolate',546,5,60,31],['كولا','Cola',42,0,10.6,0]].map(a=>({ar:a[0],en:a[1],k:a[2],p:a[3],c:a[4],f:a[5]}));
const COLS=8,ROWS=5,IDEAL={p:[20,35],c:[40,55],f:[20,35]};
let lang='ar',items=[],sel=null,budget=650,fell=false,uid=0,cs=40,why='';
const $=s=>document.querySelector(s),T=k=>L[lang][k],nm=f=>lang=='ar'?f.ar:f.en,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
try{lang=localStorage.getItem('bb-lang')||((navigator.language||'').startsWith('en')?'en':'ar')}catch(e){}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(s){const x=Math.min(...s.map(a=>a[0])),y=Math.min(...s.map(a=>a[1]));return s.map(a=>[a[0]-x,a[1]-y])}
function gen(seed,n){const r=rng(seed),D=[[1,0],[-1,0],[0,1],[0,-1]];let s=[[0,0]];while(s.length<n){const b=s[r()*s.length|0],d=D[r()*4|0],q=[b[0]+d[0],b[1]+d[1]];if(!s.some(a=>a[0]==q[0]&&a[1]==q[1]))s.push(q)}return norm(s)}
const rot=s=>norm(s.map(a=>[-a[1],a[0]])),dims=s=>[Math.max(...s.map(a=>a[0]))+1,Math.max(...s.map(a=>a[1]))+1];
function add(f,g){g=clamp(+g||100,10,600);const k=f.k*g/100,n=clamp(Math.round(k/70),1,8),m=[f.p*4,f.c*4,f.f*9],col=f.k<60?'--V':['--P','--C','--F'][m.indexOf(Math.max(...m))];
 items.push({id:++uid,f,g,n,k,p:f.p*g/100,c:f.c*g/100,fa:f.f*g/100,col,shape:gen(uid*7919+F.indexOf(f)*31,n),pos:null});if(sel===null||!items.some(i=>i.id==sel&&!i.pos))sel=uid;render()}
function find(q){q=q.trim().toLowerCase();if(!q)return;return F.find(f=>f.ar==q||f.en.toLowerCase()==q)||F.find(f=>f.ar.includes(q)||f.en.toLowerCase().includes(q))}
function ok(sh,x,y,id){if(sh.some(a=>a[0]+x<0||a[1]+y<0||a[0]+x>=COLS||a[1]+y>=ROWS))return false;const o=new Set();items.forEach(i=>{if(i.pos&&i.id!=id)i.shape.forEach(a=>o.add((a[0]+i.pos.x)+','+(a[1]+i.pos.y)))});return !sh.some(a=>o.has((a[0]+x)+','+(a[1]+y)))}
function calc(){let k=0,p=0,c=0,f=0,t=0,n=0;items.forEach(i=>{if(!i.pos)return;n++;k+=i.k;p+=i.p;c+=i.c;f+=i.fa;i.shape.forEach(a=>t+=i.k/i.n*(a[0]+i.pos.x+.5-COLS/2))});
 const m=p*4+c*4+f*9||1,s={p:p*4/m*100,c:c*4/m*100,f:f*9/m*100},ang=clamp(t/budget*10,-30,30);let dev=0;for(const x in IDEAL){const[lo,hi]=IDEAL[x];dev+=s[x]<lo?lo-s[x]:s[x]>hi?s[x]-hi:0}if(!n)dev=0;
 let w='';if(n){if(k>budget*1.15)w='f_over';else if(Math.abs(ang)>15)w='f_tilt';else if(k>=budget*.6&&(s.p<10||s.f>50||s.c>70))w='f_macro'}
 return{k,s,ang,dev,n,w}}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T(e.dataset.p));
 $('#lg').textContent=T('lang');$('#bv').textContent=budget+' '+T('kcal');
 $('#dl').innerHTML=F.map(f=>`<option value="${nm(f)}">`).join('');
 $('#chips').innerHTML=F.map((f,i)=>`<button class="chip" data-f="${i}">${nm(f)}</button>`).join('');
 cs=clamp(Math.floor(($('#stage').clientWidth-30)/COLS),26,46);
 const m=calc();
 if(!fell&&m.w){fell=true;why=m.w;const d=m.ang<0?-1:1;items.forEach(i=>i.fx={dx:d*(10+Math.random()*50),dy:Math.random()*34,r:d*(Math.random()*60-10)})}
 const dir=m.ang<0?-1:1,pl=$('#plate'),sw=fell?0:clamp(m.dev*.25,0,4);
 pl.className=fell?'fall':sw>.3?'sw':'';pl.style.setProperty('--a',(fell?dir*30:m.ang)+'deg');pl.style.setProperty('--s',sw+'deg');
 $('#board').style.cssText=`width:${COLS*cs}px;height:${ROWS*cs}px;--cs:${cs}px`;
 $('#board').innerHTML=items.filter(i=>i.pos).map(i=>{const[w,h]=dims(i.shape),fx=fell&&i.fx?`transform:translate(${i.fx.dx}px,${i.fx.dy}px) rotate(${i.fx.r}deg);`:'';
  return`<div class="blk" style="transform-origin:${(i.pos.x+w/2)*cs}px ${(i.pos.y+h/2)*cs}px;${fx}">`+i.shape.map((a,j)=>`<div class="c" data-id="${i.id}" style="left:${(a[0]+i.pos.x)*cs+1}px;top:${(a[1]+i.pos.y)*cs+1}px;width:${cs-2}px;height:${cs-2}px;background:var(${i.col})">${j?'':Math.round(i.k)}</div>`).join('')+'</div>'}).join('')+'<div id="gh"></div>';
 const tr=items.filter(i=>!i.pos);
 $('#tray').innerHTML=tr.length?tr.map(i=>{const[w,h]=dims(i.shape);let g='';for(let y=0;y<h;y++)for(let x=0;x<w;x++)g+=i.shape.some(a=>a[0]==x&&a[1]==y)?`<i style="background:var(${i.col})"></i>`:'<i></i>';
  return`<div class="it${i.id==sel?' s':''}" data-id="${i.id}"><div class="mini" style="grid-template-columns:repeat(${w},11px)">${g}</div><div class="nm"><b>${nm(i.f)}</b><small>${i.g} g · ${Math.round(i.k)} ${T('kcal')}</small></div><button class="btn g" data-r="${i.id}" aria-label="rotate">⟳</button><button class="btn g" data-x="${i.id}" aria-label="remove">✕</button></div>`}).join(''):`<p class="mu">${items.length?'':T('empty')}</p>`;
 const bar=(l,v,z,c)=>`<div class="b"><span>${l} ${Math.round(v)}%</span><div class="tr">${z?`<i class="z" style="inset-inline-start:${z[0]}%;width:${z[1]-z[0]}%"></i>`:''}<i class="fl" style="width:${clamp(v,0,100)}%;background:var(${c})"></i></div></div>`,kp=m.k/budget*100;
 $('#bars').innerHTML=bar(`${Math.round(m.k)} / ${budget} ${T('kcal')}`,kp,null,kp>100?'--P':'--V')+bar(T('protein'),m.s.p,IDEAL.p,'--P')+bar(T('carbs'),m.s.c,IDEAL.c,'--C')+bar(T('fat'),m.s.f,IDEAL.f,'--F');
 const win=!fell&&m.n&&m.k>=budget*.85&&m.k<=budget*1.1&&m.dev==0&&Math.abs(m.ang)<5,sc=clamp(Math.round(100-m.dev*3-Math.abs(m.ang)*3-Math.abs(m.k-budget)/budget*50),0,100);
 $('#msg').textContent=fell?T(why):win?T('win'):m.n?'':T('hint');
 $('#info').textContent=m.n?`${T('tilt')}: ${m.ang.toFixed(1)}° · ${T('score')}: ${sc} · ${budget-m.k>=0?T('left'):T('over')}: ${Math.abs(Math.round(budget-m.k))}`:''}
function cur(){return items.find(i=>i.id==sel&&!i.pos)}
function anchor(e){const i=cur();if(!i)return;const[w,h]=dims(i.shape);return{i,x:Math.floor(e.offsetX/cs)-(w>>1),y:Math.floor(e.offsetY/cs)-(h>>1)}}
const bd=$('#board');
bd.addEventListener('pointermove',e=>{const gh=$('#gh');if(!gh)return;if(e.target!==bd||fell){gh.innerHTML='';return}const a=anchor(e);if(!a){gh.innerHTML='';return}const v=ok(a.i.shape,a.x,a.y,a.i.id);gh.innerHTML=a.i.shape.map(s=>`<div class="gh${v?'':' bad'}" style="left:${(s[0]+a.x)*cs+1}px;top:${(s[1]+a.y)*cs+1}px;width:${cs-2}px;height:${cs-2}px"></div>`).join('')});
bd.addEventListener('click',e=>{if(fell)return;if(e.target.dataset.id){const i=items.find(i=>i.id==e.target.dataset.id);i.pos=null;sel=i.id;render();return}if(e.target!==bd)return;const a=anchor(e);if(!a||!ok(a.i.shape,a.x,a.y,a.i.id))return;a.i.pos={x:a.x,y:a.y};const n=items.find(i=>!i.pos);sel=n?n.id:null;render()});
$('#tray').addEventListener('click',e=>{const r=e.target.closest('[data-r]'),x=e.target.closest('[data-x]'),it=e.target.closest('.it');if(r){const i=items.find(i=>i.id==r.dataset.r);i.shape=rot(i.shape);sel=i.id}else if(x){items=items.filter(i=>i.id!=x.dataset.x);if(!cur()){const n=items.find(i=>!i.pos);sel=n?n.id:null}}else if(it)sel=+it.dataset.id;render()});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('[data-f]');if(c)add(F[c.dataset.f],$('#g').value)});
function addFromInput(){const f=find($('#q').value);if(!f){$('#msg').textContent=T('nf');return}add(f,$('#g').value);$('#q').value=''}
$('#ad').onclick=addFromInput;$('#q').addEventListener('keydown',e=>{if(e.key=='Enter')addFromInput()});
$('#rs').onclick=()=>{items.forEach(i=>i.pos=null);fell=false;const n=items[0];sel=n?n.id:null;render()};
$('#bd').oninput=e=>{budget=+e.target.value;render()};
$('#lg').onclick=()=>{lang=lang=='ar'?'en':'ar';try{localStorage.setItem('bb-lang',lang)}catch(e){}render()};
document.addEventListener('keydown',e=>{if((e.key=='r'||e.key=='R')&&e.target.tagName!='INPUT'){const i=cur();if(i){i.shape=rot(i.shape);render()}}});
addEventListener('resize',render);
add(F[0],150);add(F[1],150);add(F[13],100);
</script>
</body>
</html>
